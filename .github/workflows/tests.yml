name: Mining Safety API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: mining_safety
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install fastapi uvicorn sqlalchemy psycopg2-binary python-dotenv pytest requests

      - name: Create database tables
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/mining_safety
        run: python -m src.create_tables

      - name: Start API server
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/mining_safety
        run: |
          uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run tests
        run: pytest tests/test_incidents.py -v